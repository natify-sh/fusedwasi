[project]
name = "fusedwasi"
version = "0.0.0"
description = "Header-only C host for the WASI Component Model, for core modules fused from components (wasm2c and other C hosts)"
readme = "README.md"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
minversion = "9"
addopts = "-rf"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["tools"]  # reference scripts of the audits and of the comparison with Wasmtime, kept as they were written

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.400",
    "ruff>=0.16.0",
    "wasmtime>=50.0.1",
]
neutral = [
    "colorama>=0.4.6",
    "requests>=2.34.2",
]
neutral-wasm3 = [
    "pywasm3>=0.5.0",
]
