[project]
name = "fusedwasi"
version = "0.0.0"
description = "Header-only C host for the WASI Component Model, for core modules fused from components (wasm2c and other C hosts)"
readme = "README.md"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend.data]
headers = "include"
