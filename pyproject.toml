[project]
name = "fusedwasi"
dynamic = ["version"]  # from the git tag (setuptools-scm): the tag v0.1.0a1 is the version 0.1.0a1
description = "WASI 0.1 and 0.2 as ready functions for any host, in C (headers) and Python, with the state they need and the table of their signatures"
readme = "README.md"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
license = "MIT"
license-files = ["LICENSE", "tools/spec_sources/LICENSE.md"]  # the library, and the licence of the WASI specification the signature tables are made from
keywords = ["wasi", "webassembly", "wasm", "wasm2c", "component-model", "preview1", "preview2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/natify-sh/fusedwasi"
Issues = "https://github.com/natify-sh/fusedwasi/issues"

[build-system]
requires = ["setuptools>=84", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true  # whatever git tracks inside the package (setuptools-scm lists it); the explicit list below does not depend on git

# The headers, the tables and py.typed, named: a build with no git (a copy of the tree, a build by another tool of a checkout) has the same wheel as one with git.
[tool.setuptools.package-data]
fusedwasi = ["py.typed", "public_api.json", "include/*.h", "include/fusedwasi/*/*.h", "signatures/*.json", "signatures/*.pyi"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"  # a copy with neither git nor PKG-INFO

[tool.pytest.ini_options]
minversion = "9"
addopts = "-rf"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["tools"]  # reference scripts of the audits and of the comparison with Wasmtime, kept as they were written

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# the library and its white-box tests reach each other's private names (a leading underscore); that the neutral users do not is checked by tests/test_public_api.py
reportPrivateUsage = false
reportUnusedFunction = false  # a private helper (a leading underscore) is used by the other modules of the package
reportUnusedClass = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.400",
    "ruff>=0.16.0",
    "wasmtime>=50.0.1",
]
neutral = [
    "colorama>=0.4.6",
    "requests>=2.34.2",
]
neutral-wasm3 = [
    "pywasm3>=0.5.0",
]
