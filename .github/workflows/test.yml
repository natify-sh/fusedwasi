name: Tests

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "*.md", "LICENSE"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest, pyright, ruff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q -rs
