name: Tests

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "*.md", "LICENSE"]
  pull_request:

# a newer push to the same ref cancels the run in progress (as in the other natify-sh repositories)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest, pyright, ruff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -q -rs
      # a measurement and not a test: what this system copies from a listener to the socket that accept() makes (docs/host_scope.md, Known limits); the answer is in the log
      - name: What does this system copy in accept()
        run: uv run python tools/probe_accept_inheritance.py
