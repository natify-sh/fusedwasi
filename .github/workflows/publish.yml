name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

run-name: >
  ${{ github.event_name == 'push' && 'Build & Publish PyPI' || 'Build' }}

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: The tag is the version in pyproject.toml
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != version $version"; exit 1; }

      - name: Build (the wheel is built from the sdist, so this proves the sdist builds on its own)
        run: uv build --out-dir dist

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv -q /tmp/smoke
          uv pip install -q --python /tmp/smoke dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import fusedwasi; print('ok', fusedwasi.__file__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: artifacts/dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "fusedwasi ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/dist/*
