name: C checks

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "*.md", "LICENSE"]
  pull_request:

permissions:
  contents: read

jobs:
  sanitizers:
    name: tests with the C drivers under ASan and UBSan (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.11"
      - run: uv sync
      # The tests build their C drivers with `cc`: a `cc` that adds the sanitizers is put first on PATH. Python itself is not instrumented.
      - name: A cc with the sanitizers
        run: |
          mkdir -p "$RUNNER_TEMP/san"
          printf '#!/bin/sh\nexec gcc -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g "$@"\n' > "$RUNNER_TEMP/san/cc"
          chmod +x "$RUNNER_TEMP/san/cc"
          echo "$RUNNER_TEMP/san" >> "$GITHUB_PATH"
      - run: uv run pytest -q
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1

  msvc:
    name: the headers compile with MSVC (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every header on its own, C11, warnings are errors
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set INC=src\fusedwasi\include\fusedwasi
          set FAIL=0
          for %%v in (p1\wasi_p1_core.h p1\wasi_p1.h p1\wasi_p1_unstable.h p2\wasi_p2_core.h p2\wasi_p2_cli.h p2\wasi_p2_clocks.h p2\wasi_p2_filesystem.h p2\wasi_p2_http.h p2\wasi_p2_io.h p2\wasi_p2_random.h p2\wasi_p2_sockets.h) do (
            echo #include "%%~nxv"> check.c
            echo int main^(void^) { return 0; }>> check.c
            cl /nologo /std:c11 /W3 /WX /c /Fo:NUL /I%INC%\p1 /I%INC%\p2 check.c || set FAIL=1
          )
          exit /b %FAIL%

  msvc-run:
    name: tests with the C drivers built by MSVC (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.11"
      - run: uv sync
      # The tests build their C with the compiler that FUSEDWASI_TEST_CC names: `cl` of the environment of vcvars64.bat, /std:c11 /W4 /WX, the same drivers that MinGW builds in test.yml,
      # then run them and compare with the Python twin. The libraries are not on the command line: the headers ask for them with `#pragma comment(lib, ...)`, as for a user.
      # -rs lists every skip with its reason; FUSEDWASI_ALLOWED_SKIPS fails the run when the reason is not one of what Windows does not have.
      - name: Every C program and the Python twin of each, built with cl and run
        shell: cmd
        env:
          FUSEDWASI_TEST_CC: cl
          FUSEDWASI_ALLOWED_SKIPS: 'pipe\(\)|FIFO|select\.poll|Windows maps its own error numbers'
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl 2>&1 | findstr /i "Version"
          uv run pytest -q -rs tests/test_driver_matrix.py tests/test_wasi_p1_headers.py tests/test_wasi_p1_core.py tests/test_wasi_p1_errno.py tests/test_wasi_p1_over_p2.py tests/test_wasi_p2_cli.py tests/test_wasi_p2_clocks.py tests/test_wasi_p2_filesystem.py tests/test_wasi_p2_http.py tests/test_wasi_p2_io.py tests/test_wasi_p2_random.py tests/test_wasi_p2_sockets.py tests/test_parity_surface.py tests/test_known_limits.py
